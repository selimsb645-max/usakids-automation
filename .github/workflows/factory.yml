name: USA Kids Factory

# Autonomous kids-video producer - runs entirely on GitHub free minutes.
# Public slot 18:30 Asia/Dhaka daily (US kids morning ~8:30 AM ET).
# Production run 10:30 BD (04:30 UTC) books the slot with 8h lead.
# Made for Kids channel: comments auto-disabled, no engagement tasks.

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "produce or selftest"
        default: "produce"

permissions:
  contents: write

concurrency:
  group: usakids-produce
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -q kokoro-onnx soundfile numpy pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          command -v ffmpeg && ffmpeg -version | head -1

      - name: Restore shared Kokoro voice model (cross-repo release asset)
        env:
          GITHUB_TOKEN: ${{ secrets.ASSETS_GH_TOKEN }}
        run: |
          set -e
          python3 - <<'PY'
          import json, os, urllib.request
          slug = "selimsb645-max/nextai-video-automation"
          tok = os.environ['GITHUB_TOKEN']
          req = urllib.request.Request(f'https://api.github.com/repos/{slug}/releases',
                                       headers={'Authorization': 'Bearer ' + tok})
          rels = json.load(urllib.request.urlopen(req, timeout=60))
          rel = next(r for r in rels
                     if any(a['name'] == 'nextai-runtime-assets.tar.gz'
                            for a in r.get('assets', [])))
          a = next(a for a in rel['assets'] if a['name'] == 'nextai-runtime-assets.tar.gz')
          req = urllib.request.Request(a['url'], headers={
              'Authorization': 'Bearer ' + tok,
              'Accept': 'application/octet-stream'})
          with urllib.request.urlopen(req, timeout=900) as r, open('assets.tar.gz', 'wb') as f:
              while True:
                  chunk = r.read(1 << 22)
                  if not chunk:
                      break
                  f.write(chunk)
          print('downloaded', os.path.getsize('assets.tar.gz'), 'bytes')
          PY
          tar -xzf assets.tar.gz -C "$GITHUB_WORKSPACE" factory/tts_kokoro
          ls factory/tts_kokoro/
          rm -f assets.tar.gz

      - name: Production turn (lesson -> PIL animation -> Kokoro voice -> render -> publishAt upload)
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          ASSETS_GH_TOKEN: ${{ secrets.ASSETS_GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KIDS_VOICE: af_heart
        run: |
          mkdir -p yt-auth
          echo "$YT_TOKEN_JSON" > yt-auth/token_usakids.json
          MODE="${{ github.event.inputs.mode || 'produce' }}"
          python3 actions/runner.py --mode "$MODE"

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-files
          path: |
            actions/reports/
            factory/state.json
          if-no-files-found: ignore
          retention-days: 7
